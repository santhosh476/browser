<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Chrome</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Top Chrome Header Container -->
  <header class="chrome-header">
    <!-- Tabs Strip -->
    <div class="tabs-bar">
      <div class="tabs-container" id="tabs-container">
        <!-- Tabs dynamically injected here -->
      </div>
      <button class="new-tab-btn" id="new-tab-btn" title="New Tab (Ctrl+T)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
        </svg>
      </button>
    </div>

    <!-- Navigation Bar / Toolbar -->
    <div class="toolbar">
      <div class="nav-controls">
        <button class="nav-btn" id="btn-back" title="Click to go back" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
          </svg>
        </button>
        <button class="nav-btn" id="btn-forward" title="Click to go forward" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
          </svg>
        </button>
        <button class="nav-btn" id="btn-reload" title="Reload this page">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" id="reload-icon">
            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
        </button>
        <button class="nav-btn" id="btn-home" title="Open the home page">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
          </svg>
        </button>
      </div>

      <!-- Omnibox (Address & Search Bar) -->
      <div class="omnibox-container" id="omnibox-box">
        <div class="omnibox-icon" id="security-icon" title="View site information">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
          </svg>
        </div>
        <input type="text" id="omnibox-input" class="omnibox-input" placeholder="Search Google or type a URL" spellcheck="false" autocomplete="off" />
        <div class="omnibox-action-btn" id="bookmark-star-btn" title="Bookmark this tab">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M22 9.24l-7.19-.62L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.63-7.03L22 9.24zM12 15.4l-3.76 2.27 1-4.28-3.32-2.88 4.38-.38L12 6.1l1.71 4.04 4.38.38-3.32 2.88 1 4.28L12 15.4z"/>
          </svg>
        </div>
      </div>

      <!-- Right Action Icons -->
      <div class="toolbar-actions">
        <button class="nav-btn" id="btn-devtools" title="Developer Tools (F12)">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
            <path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/>
          </svg>
        </button>
        <button class="nav-btn profile-avatar" title="Chrome Profile">
          <div class="avatar-circle">G</div>
        </button>
        <button class="nav-btn" id="btn-menu" title="Customize and control Google Chrome">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Bookmarks Bar -->
    <div class="bookmarks-bar" id="bookmarks-bar">
      <div class="bookmark-item" data-url="https://www.google.com">
        <img class="bookmark-icon" src="https://www.google.com/favicon.ico" onerror="this.style.display='none'" />
        <span>Google</span>
      </div>
      <div class="bookmark-item" data-url="https://www.youtube.com">
        <img class="bookmark-icon" src="https://www.youtube.com/favicon.ico" onerror="this.style.display='none'" />
        <span>YouTube</span>
      </div>
      <div class="bookmark-item" data-url="https://github.com">
        <img class="bookmark-icon" src="https://github.com/favicon.ico" onerror="this.style.display='none'" />
        <span>GitHub</span>
      </div>
      <div class="bookmark-item" data-url="https://en.wikipedia.org">
        <img class="bookmark-icon" src="https://en.wikipedia.org/favicon.ico" onerror="this.style.display='none'" />
        <span>Wikipedia</span>
      </div>
      <div class="bookmark-item" data-url="https://news.ycombinator.com">
        <span>Hacker News</span>
      </div>
    </div>
  </header>

  <!-- Menu Dropdown -->
  <div class="menu-dropdown" id="menu-dropdown">
    <div class="menu-item" id="menu-new-tab">
      <span>New Tab</span>
      <span class="menu-shortcut">Ctrl+T</span>
    </div>
    <div class="menu-item" id="menu-reload">
      <span>Reload</span>
      <span class="menu-shortcut">Ctrl+R</span>
    </div>
    <div class="menu-divider"></div>
    <div class="menu-item" id="menu-zoom-in">
      <span>Zoom In (+)</span>
      <span class="menu-shortcut">Ctrl++</span>
    </div>
    <div class="menu-item" id="menu-zoom-out">
      <span>Zoom Out (-)</span>
      <span class="menu-shortcut">Ctrl+-</span>
    </div>
    <div class="menu-item" id="menu-zoom-reset">
      <span>Reset Zoom</span>
      <span class="menu-shortcut">100%</span>
    </div>
    <div class="menu-divider"></div>
    <div class="menu-item" id="menu-devtools">
      <span>Developer Tools</span>
      <span class="menu-shortcut">F12</span>
    </div>
    <div class="menu-divider"></div>
    <div class="menu-item" id="menu-about">
      <span>About Google Chrome</span>
    </div>
  </div>

  <!-- Webviews Container -->
  <main class="webview-container" id="webview-container">
    <!-- Webviews will be dynamically appended here -->
  </main>

  <script src="renderer.js"></script>
</body>
</html>
